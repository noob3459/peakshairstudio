<!doctype html>
<!-- Source for public/hero-mockups.webp: abstract website mockups, core palette only. Not real client work. -->
<meta charset="utf-8">
<style>
:root{--navy:#0B1626;--blue:#1B3A6B;--gold:#C9A227;--bg:#F9F9F7;--line:#E3E1DA;--slate:#626878}
*{box-sizing:border-box}html,body{margin:0}
body{width:2400px;height:1350px;background:var(--navy);position:relative;overflow:hidden}
.win{position:absolute;background:var(--bg);border-radius:22px;box-shadow:0 60px 120px -30px rgba(0,0,0,.7);overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.bar{height:56px;background:var(--line);display:flex;align-items:center;gap:10px;padding:0 22px}
.bar i{width:14px;height:14px;border-radius:50%;background:var(--slate);opacity:.45}
.bar b{margin-left:18px;flex:1;height:26px;border-radius:13px;background:var(--bg)}
.pg{padding:30px 34px}
.nav{display:flex;gap:18px;align-items:center;margin-bottom:34px}
.nav u{width:120px;height:18px;background:var(--navy);border-radius:6px}.nav s{width:64px;height:10px;background:var(--line);border-radius:5px}.nav s:first-of-type{margin-left:auto}.nav em{width:96px;height:32px;background:var(--blue);border-radius:16px}
.hero{background:var(--navy);border-radius:16px;padding:46px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h4{height:26px;background:#fff;border-radius:7px;margin:0 0 14px}.hero h4.s{width:64%}
.hero p{height:10px;background:rgba(255,255,255,.4);border-radius:5px;margin:0 0 9px}.hero p.s{width:70%}
.hero small{display:block;width:84px;height:8px;background:var(--gold);border-radius:4px;margin-bottom:24px}
.btns{display:flex;gap:12px;margin-top:26px}.btns u{width:120px;height:36px;background:var(--blue);border-radius:18px}.btns s{width:80px;height:36px;border:2px solid rgba(255,255,255,.35);border-radius:18px}
.art{position:relative;height:210px}.art div{position:absolute;border-radius:12px}.art div:first-child{inset:0 50px 40px 0;background:var(--blue)}.art div:last-child{inset:60px 0 0 70px;border:3px solid var(--gold);background:rgba(11,22,38,.5)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.cards div{height:110px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.cards div::before{content:"";display:block;width:40px;height:6px;background:var(--gold);border-radius:3px;margin-bottom:14px}.cards div::after{content:"";display:block;width:80%;height:9px;background:var(--line);border-radius:5px}
.phone{position:absolute;width:300px;background:var(--bg);border:9px solid var(--blue);border-radius:44px;padding:30px 20px;box-shadow:0 60px 100px -30px rgba(0,0,0,.75)}
.phone .hero{padding:24px;grid-template-columns:1fr}.phone .art{height:90px}
.row{height:48px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:14px}
</style>
